; ESP32 (Arduino) hello/blink + a moving-average filter on synthetic samples, run in Espressif QEMU. ./run.sh
[env:esp32dev]
; 6.13.0 = Arduino-ESP32 2.0.x: 3.x (espressif32 >= 7) panics in QEMU in ~40% of boots, see SKILL.md Limits
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
