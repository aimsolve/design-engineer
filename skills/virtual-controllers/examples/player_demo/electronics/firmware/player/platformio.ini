; player: ESP32 + ST7789 240x320 (esp_lcd) + LVGL 9.2, three buttons, an EC11 encoder. The example device of skills/virtual-controllers.
; The same src/ is built to wasm for the model page: node <skills>/virtual-controllers/build/build.mjs --name player --board esp32
;   --sketch src/main.cpp --libdeps .pio/libdeps/player --include include --out ../../../build/fw   (after `pio pkg install -e player`)
[env:player]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.2.2
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
