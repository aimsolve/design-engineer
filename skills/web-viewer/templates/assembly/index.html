     the project folder holds only data. config.json says the title, whether there are a sim / baked edges / a cycle, and the build stamp. -->

<style>
  :root { --fs:14px; --bg:#eef2f5; --ink:#1d2730; --muted:#5b6873; --acc:#d9480f; --panel:#ffffffee; --line:#cfd8df; --sel:#fbdcf3; }
  * { box-sizing:border-box; }

               font:var(--fs)/1.4 -apple-system, system-ui, sans-serif; }
  #stage { position:fixed; inset:0; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage canvas { display:block; touch-action:none; }

          border-radius:10px; padding:8px 12px 10px; overflow:auto; }
  .head { display:flex; align-items:center; gap:4px; min-height:30px; cursor:pointer; }
  .ttl { flex:1; min-width:0; font-weight:700; font-size:calc(var(--fs) + 1px); }
  .collapsed .ttl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .collapsed .body { display:none; }
  #pLang { border:0; background:none; font:inherit; font-size:calc(var(--fs, 14px) - 2px); color:var(--muted); padding:2px 0; cursor:pointer; }

                 color:var(--ink); text-decoration:none; display:inline-block; }
  button.on { background:var(--acc); color:#fff; border-color:var(--acc); }

  .hint { color:var(--muted); font-size:calc(var(--fs) - 3px); margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }

  .more { color:var(--muted); font-size:12px; padding:4px; }
  #info { top:16px; right:16px; width:340px; max-width:calc(100vw - 32px); max-height:calc(100vh - 32px); }
  #infoP { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:6px 0; font-size:calc(var(--fs) - 2px); }

  #info .row button, #info .row .btn { flex:1 1 auto; text-align:center; }

  .mob { display:none; }
  /* high contrast (weak eyesight): bigger type, white page, darker text, stronger panel borders */
  :root.hc { --fs:18px; --bg:#ffffff; --ink:#000; --muted:#26313b; --line:#5b6873; --panel:#fffffff5; --sel:#ffc8ef; }

  @media (max-width:700px) {

            padding:6px 10px calc(8px + env(safe-area-inset-bottom)); }

  #linkRow .btnlink { display:inline-block; padding:6px 10px; border:1px solid #c9d1d9; border-radius:8px; text-decoration:none; color:inherit; font-size:13px; }

  button:hover:not(:disabled), .btn:hover { border-color:#9fb0bd; }

  .sec.grow:not(.collapsed) .sb { flex:1; min-height:0; display:flex; flex-direction:column; }

<body>
<div id="stage"></div>
<div id="panel" class="card">
  <div class="head" id="pHead"><div class="ttl" id="pTitle"></div><select id="pLang"></select><button class="icon fold" id="pFold"></button></div>
  <div id="load">…</div>
  <div id="bar"><div id="barFill"></div></div>
  <div class="body">
    <div class="tools"><button id="bReset" class="ghost"></button><div class="row" id="linkRow" hidden></div></div>
    <section class="sec" id="secView" data-k="view">
      <h3 class="sh"></h3>
      <div class="sb">
        <div class="row" id="viewsRow"><button id="bViewFront"></button><button id="bViewBack"></button><button id="bViewLeft"></button><button id="bViewRight"></button><button id="bViewTop"></button><button id="bViewBottom"></button><button id="bViewIso"></button></div>
        <div class="row" id="colRow"><span class="sub" id="colLbl"></span><span class="seg"><button id="bColCad" hidden></button><button id="bColMat"></button><button id="bColKind"></button></span></div>
        <div class="legend" id="legend"></div>
        <!-- the tools first, then the look; this order also wraps into two lines, and the panel has to stay short enough that "Download files" needs no scrolling -->
        <div class="row" id="viewRow"><span class="sub" id="viewLbl"></span><button id="bGrid"></button><button id="bMeasure"></button><button id="bEdges"></button><button id="bAO"></button><button id="bHC"></button></div>
        <div class="row" id="gridRow" hidden><span class="sub" id="gridLbl"></span><select id="gridStep"></select><span class="sub" id="gridSize"></span></div>
        <div class="row" id="measRow" hidden><span class="sub" id="measOut"></span><button id="measClear" class="ghost" hidden></button></div>
        <div class="sub" id="fxNote" hidden></div>
      </div>
    </section>
    <section class="sec" id="secHw" data-k="hw" hidden>
      <h3 class="sh"></h3>
      <div class="sb"></div>
    </section>
    <section class="sec" id="secDl" data-k="dl" data-collapsed="1" hidden>
      <h3 class="sh"></h3>
      <div class="sb"></div>
    </section>
    <section class="sec grow" id="secParts" data-k="parts">
      <h3 class="sh"></h3>
      <div class="sb">
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <button id="bShowAll" class="ghost" hidden></button>
        <div id="tree"></div>
        <div class="hint desk" id="hintD"></div><div class="hint mob" id="hintM"></div>
      </div>
    </section>
  </div>
</div>
<svg id="measSvg" hidden aria-hidden="true"></svg><div id="measLbl" hidden aria-hidden="true"></div>
<div id="hwDock"></div>
<div id="info" class="card" hidden>
  <div class="head" id="infoHead"><div class="ttl" id="infoT"></div><button class="icon fold" id="infoFold"></button><button class="icon" id="infoX">×</button></div>
  <div class="body">
    <dl id="infoP"></dl>
    <div class="row" id="rowDl"><a class="btn" id="dlStep" download></a><a class="btn" id="dlStl" download></a></div>
    <div class="row"><button id="infoHide"></button><button id="infoHideStem" hidden></button></div>
    <div class="row"><button id="infoCenter"></button><button id="infoOnly" hidden></button></div>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "/_viewer/vendor/jsm/loaders/GLTFLoader.js";
import "/_viewer/win.js";

import { DICT, LANGS, NAME_WORDS, resolveLang, switchLang } from "/_viewer/i18n.js";


// Assembly viewer for imported CAD: model.glb (metres, Z-up, instanced) + parts.json catalogue + parts/<id>.step|stl.
// Static site: no build step, no CDN. World units here are millimetres, Y up (the glTF is scaled x1000 and rotated).
const V3 = THREE.Vector3;
const LANG = await resolveLang(new URL("./", location.href)), L = DICT[LANG];   // ru | en | pl (i18n.mjs)
const KIND_COLOR = { made: 0xc9d0d6, standard: 0x7c858e, purchased: 0x6b8bb0, unknown: 0xb0b0b0 };
// material -> [colour, roughness, metalness, extra]. Restrained and realistic; the one saturated colour is printed plastic, so custom parts pop.
const MAT_STYLE = {

  n = n || 30; const gl = renderer.getContext(), px = new Uint8Array(4), sync = () => { gl.finish(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };   // readPixels forces the GPU to really finish
  applyCamera(); fx.render(); sync();
  const t0 = performance.now();
  for (let i = 0; i < n; i++) { cam.yaw += 0.01; applyCamera(); fx.render(); }
  sync();
  return { msPerFrame: (performance.now() - t0) / n, drawCalls: fx.stats.calls, triangles: fx.stats.triangles };
};
api.hash = "";
api.canvas = canvas; api.writeHash = writeHash;   // feedback flushes the throttled hash before it reports location.href
api.pickAt = pickAt;                                // the device layer (device_ui.mjs) presses the part under the mouse
api.renderNow = () => { applyCamera(); fx.render(); };   // a frame on the canvas NOW: read it in the same tick (no preserveDrawingBuffer)
api.setColorMode = setColorMode; api.colorMode = () => COLMODE;

// Baked feature edges (edges.json/.bin from step-import/scripts/bake_edges.py): loaded after the model is on screen, lines added in small batches.
async function startEdges() {
  api.edges = { loaded: false, lines: 0 };
  if (!api.config || !api.config.edges) return;
  const t0 = performance.now();
  try {
    const r = await attachEdges(THREE, { url: dataUrl(api.config.edges), byPart: BYPART, invalidate,
      lineMat: () => (fx.supported ? LM.marker : LM.direct), visible: () => VIEW.edges, onLine: (l) => LINES.push(l),
      onProgress: (f) => { $("load").textContent = fmt(L.edgesLoading, { pct: Math.round(f * 100) }); } });
    Object.assign(api.edges, r, { loaded: true, ms: performance.now() - t0 });
  } catch (e) { console.warn("edges not loaded", e); api.edges.error = String(e); }
  $("load").textContent = fmt(L.ready, { m: api.stats.meshes, p: api.stats.distinct, t: num(api.stats.triangles / 1e6, 2) });
  invalidate();
}

// The machine layer: only when the site was built with --sim (config.json `sim` -> sim/config.json). Runs beside the model load; never blocks it.
async function initSim() {
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 50));
  if (!api.config || !api.config.sim) return;   // absent = no machine (and no 404 in the console)
  let cfg = null;
  try { const r = await fetch(dataUrl(api.config.sim)); if (r.ok) cfg = await r.json(); } catch (e) { /* broken build */ }
  if (!cfg) return;
  try {
    const mod = await import("/_viewer/sim_ui.js");
    while (!api.ready && !api.error) await new Promise((r) => setTimeout(r, 50));   // panel + tree exist only after the model is up
    if (api.error) return;
    await mod.mount({ api, L, $, fmt, esc, BYPART, narrow, store, cfg });
  } catch (err) { console.error(err); api.simError = String(err && err.stack || err); }
}
initSim();

// Cycle animation (code-CAD machines): only when the site was built with a motion.json that has a `cycle` block (config.json `cycle`). No sim needed.
async function initCycle() {
  const hash0 = location.hash;   // the page rewrites the hash once the model is up; #t= must be read before that
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 50));
  if (!api.config || !api.config.cycle) return;
  try {
    const mod = await import("/_viewer/motion.js");
    while (!api.ready && !api.error) await new Promise((r) => setTimeout(r, 50));
    if (api.error) return;
    await mod.mountCycle({ api, L, $, PARTS, BYPART, narrow, file: dataUrl(api.config.cycle), hash0 });
  } catch (err) { console.error(err); api.cycleError = String(err && err.stack || err); }
}
initCycle();

// Visual feedback (draw on the frame + comment -> POST): only when config.json has `feedback` (build.py --feedback URL).
async function initFeedback() {
  while (!api.ready && !api.error) await new Promise((r) => setTimeout(r, 50));
  if (api.error || !api.config || !api.config.feedback) return;
  try { const mod = await import("/_viewer/feedback.js"); mod.mountFeedback({ api, L, cfg: api.config }); }
  catch (err) { console.error(err); api.feedbackError = String(err && err.stack || err); }
}
initFeedback();
// Download kits (files for manufacturing, built from the current model on request): only when config.json has `kit` (build.py --kit).
async function initKit() {   // as soon as config.json is read, not after the model: the buttons must not appear late
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 50));
  if (!api.config || !api.config.kit) return;
  try { const mod = await import("/_viewer/kit.js"); await mod.mountKit({ api, L, cfg: api.config }); }
  catch (err) { console.error(err); api.kitError = String(err && err.stack || err); }
}
initKit();
// The model is rebuilt by the router after the bot changes it: public/model.json {v, building}. While it builds, a banner;
// once a newer version is up, the page reloads onto it (the hash keeps camera and selection), never in the middle of a download wait
// or while someone types a comment (it reloads once the text is sent or cleared).
async function initModelLive() {
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 100));
  if (!api.config || !api.config.kit) return;   // only pages of the stack (kit auto): the router writes model.json there
  let v0 = null, was = false, bar = null;   // v0: the last built version at load (`built`; an older router: `v`)
  for (;;) {
    let m = null;
    try { const r = await fetch("model.json", { cache: "no-store" }); if (r.ok) m = await r.json(); } catch (e) { /* none yet */ }
    if (m) {
      const v = m.built != null ? m.built : m.v;
      if (v0 === null) v0 = v;
      if (m.building && !bar && !document.getElementById("kitToast")) {   // a link download shows its own notice
        bar = document.createElement("div"); bar.id = "modelBanner"; bar.textContent = L.banner;
        bar.style.cssText = "position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;padding:6px 14px;border-radius:6px;" +
          "background:var(--acc,#1c7ed6);color:#fff;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none";
        document.body.appendChild(bar);
      }
      if (!m.building && bar) { bar.remove(); bar = null; }
      was = was || m.building;
      const waiting = api.kit && api.kit.state().waiting;
      const typing = [...document.querySelectorAll("textarea")].some((t) => t.value.trim()) ||
        (document.activeElement || {}).tagName === "TEXTAREA";   // never throw away a comment being written
      if (!m.building && (v > v0 || (was && m.built == null)) && !waiting && !typing) { location.reload(); return; }   // a failed build: no reload
    }
    await new Promise((r) => setTimeout(r, 5000));
  }
}
initModelLive();
// Parts that share space: build.py checks a code model on every build and publishes the result as clearance.json; it
// never blocks the page. A clash is a red mark at the top; its list jumps to the moment and the part.
async function initClearance() {
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 100));
  if (!api.config || !api.config.clearance) return;
  let rep = null;
  try { const r = await fetch(api.config.clearance + "?v=" + (api.config.v || ""), { cache: "no-store" }); if (r.ok) rep = await r.json(); } catch (e) { /* none */ }
  api.clearance = rep;
  const cl = (rep && rep.clashes) || [];
  if (!cl.length) return;
  while (!CAT && !api.error) await new Promise((r) => setTimeout(r, 100));   // names come from parts.json: never a row of bare ids
  const box = document.createElement("div"); box.id = "clashMark";
  const narrow = matchMedia("(max-width: 700px)").matches;   // phones: the panel fills the top half, so the mark goes to the bottom
  // centred by margins, not left:50% + translate: that halves the width a fixed box may take, and a row then wraps into 4-5 lines
  box.style.cssText = "position:fixed;" + (narrow ? "bottom:64px;width:92vw;" : "top:44px;width:fit-content;") + "left:0;right:0;margin:0 auto;z-index:40;max-width:min(92vw,460px);font-size:13px;color:#fff;" +
    "background:#c92a2a;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)";
  const head = document.createElement("button"); head.id = "clashHead";
  head.style.cssText = "all:unset;cursor:pointer;display:block;padding:6px 12px;font-weight:600";
  head.textContent = fmt(L.clash.head, { n: cl.length });
  head.title = L.clash.tip + (rep.assembled ? (rep.consent === "cad" ? L.clash.byCad : L.clash.built) + L.clash.withYou : L.clash.fixing);
  const list = document.createElement("div"); list.id = "clashList"; list.hidden = true;
  list.style.cssText = "max-height:40vh;overflow:auto;padding:0 6px 6px;scroll-snap-type:y proximity";
  const nm = (id) => (PARTS[id] ? shortName(PARTS[id].name, PARTS[id].drawing) : id);   // the card's title, as the client knows the part
  for (const c of cl) {
    const b = document.createElement("button"); b.title = c.a + " × " + c.b;
    b.style.cssText = "all:unset;cursor:pointer;display:block;padding:3px 6px;border-top:1px solid rgba(255,255,255,.25);scroll-snap-align:start;width:100%;box-sizing:border-box";
    // the pair first, on its own line; the numbers under it: a row never shows numbers without the parts they belong to
    const who = document.createElement("div"); who.className = "clashPair"; who.textContent = nm(c.a) + " × " + nm(c.b);
    const how = document.createElement("div"); how.className = "clashNums"; how.style.cssText = "font-size:12px;opacity:.85";
    how.textContent = c.volume_mm3 + " " + L.clash.mm3 + (c.t_s != null ? " · t " + c.t_s + " " + L.clash.s : "");
    b.append(who, how);
    b.addEventListener("click", () => {
      if (c.t_s != null && api.cycle) api.cycle.setTime(c.t_s);
      if (api.select) api.select(c.a, true);
    });
    list.appendChild(b);
  }
  head.addEventListener("click", () => { list.hidden = !list.hidden; });
  box.append(head, list); document.body.appendChild(box);
}
initClearance();
// The machine's app: the router publishes the released APK on the project page (public/apk/latest.json + the file, router publish_apk).
// Its own row at the top of "Download files" (kit.mjs rebuilds its own row, not this one); no APK released -> nothing is shown.
async function initApk() {
  let a = null;
  // 204 = the stack's answer for a project with no release; 404 on a plain static server. Both mean «no app».
  try { const r = await fetch("apk/latest.json", { cache: "no-store" }); if (r.ok && r.status !== 204) a = await r.json(); } catch (e) { /* no app */ }
  if (!a || !a.file) return;
  const sec = $("secDl"), body = sec && sec.querySelector(".sb");
  if (!body) return;
  const row = document.createElement("div"); row.className = "row"; row.id = "apkRow";
  const b = document.createElement("button"); b.id = "bApk"; b.textContent = L.apk.button;
  b.title = fmt(L.apk.tip, { v: a.version });
  b.addEventListener("click", () => { location.href = "apk/" + encodeURIComponent(a.file); });
  const v = document.createElement("div"); v.className = "kitHint"; v.style.cssText = "flex-basis:100%;font-size:12px;color:var(--muted)"; v.textContent = fmt(L.apk.ver, { v: a.version });
  row.append(b, v); body.prepend(row); sec.hidden = false;
  api.apk = a;
}
initApk();
// Flashing real boards through the viewer (Web Serial): only when config.json has `flash` (build.py --flash).
async function initHw() {
  while (!api.config && !api.error) await new Promise((r) => setTimeout(r, 50));
  if (!api.config || !api.config.flash) return;
  try { const mod = await import("/_viewer/hw.js"); await mod.mountHw({ api, L, cfg: api.config }); }
  catch (err) { console.error(err); api.hwError = String(err && err.stack || err); }
}
initHw();

try {
  await load();
  const home = homeView();
  Object.assign(cam, { yaw: home.yaw, pitch: home.pitch, dist: home.dist, target: home.target });
  ZOOM = [8, sceneSize * 3];
  initTools();
  EXP.add(ROOT);
  renderLegend();
  applyHash();
  renderTree(true);
  invalidate();
  api.ready = true;
  startEdges();
} catch (err) {
  console.error(err);
  $("load").textContent = fmt(L.failed, { e: err && err.message ? err.message : err });
  api.error = String(err);
}
requestAnimationFrame(frame);
</script>
</body>
