<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash test</title>
<style>body{font:14px system-ui;margin:16px;max-width:760px}label{display:block;margin:6px 0}input,select{font:inherit;padding:4px}
#mf{width:100%}button{font:inherit;padding:6px 12px;margin:4px 4px 4px 0}#bar{height:6px;background:#ddd;margin:8px 0}#bar i{display:block;height:100%;width:0;background:#2b8a3e}
#err{color:#c92a2a}pre{background:#111;color:#cfc;padding:8px;height:320px;overflow:auto;white-space:pre-wrap}</style></head>
<body>
<h3>Flashing and monitor (Web Serial)</h3>
<label>Board <select id="kind"><option>esp32</option><option>avr</option></select></label>
<label>Manifest (URL) <input id="mf" value="manifest.json"></label>
<label>Speed, baud (empty = default) <input id="baud" type="number" placeholder="auto"></label>
<button id="flash">Pick a port and flash</button><button id="mon">Monitor</button><button id="rst">Reset</button><button id="dl">Download the log</button>
<div id="bar"><i></i></div><div id="err"></div><div id="st"></div>
<pre id="out"></pre>
<script type="module">
import * as F from "./flash.mjs";
const $ = (id) => document.getElementById(id), out = $("out");
const line = (l) => { out.textContent += l + "\n"; out.scrollTop = out.scrollHeight; };
const fail = (e) => { $("err").textContent = e.message || e; };
if (!F.webSerialSupported()) fail(new Error(F.friendlyError(new Error("NO_WEB_SERIAL"))));
$("flash").onclick = async () => {
  $("err").textContent = "";
  try {
    const url = new URL($("mf").value, location.href), m = await (await fetch(url)).json();
    if (m.kind) $("kind").value = m.kind;
    const files = m.files.map((f) => ({ ...f, url: new URL(f.url, url).href }));
    await F.flashBoard({ kind: $("kind").value, files, monitorSpeed: m.monitor_speed, baud: +$("baud").value || undefined,
      onProgress: (p, l) => { $("bar").firstChild.style.width = p + "%"; $("st").textContent = p + "% " + l; }, onLog: line });
  } catch (e) { fail(e); }
};
$("mon").onclick = async () => { $("err").textContent = ""; try { await F.openMonitor({ baud: +$("baud").value || 115200, onData: (l) => line(l) }); } catch (e) { fail(e); } };
$("rst").onclick = async () => { try { await F.resetBoard(); } catch (e) { fail(e); } };
$("dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([F.getLog()], { type: "text/plain" })); a.download = "serial-log.txt"; a.click(); };
</script></body></html>
