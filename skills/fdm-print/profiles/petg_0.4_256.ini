# PrusaSlicer native profile: generic 256 mm bed, 0.4 nozzle, PETG, 0.2 layer, 3 perimeters, 15 % gyroid.
# Matches a common first-client setup. Copy and edit per client; speeds are PrusaSlicer-generic,
# so times are a conservative estimate, not his printer's exact number.
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
gcode_flavor = marlin2
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
support_material = 0
brim_width = 0
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
